<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claule</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Subtle vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .wordmark {
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 2.5rem;
      user-select: none;
    }

    .widget-area {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tagline {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      user-select: none;
    }

    /* Dim the ElevenLabs branding inside the widget if needed */
    elevenlabs-convai {
      --convai-background-color: transparent;
      --convai-button-color: rgba(255,255,255,0.08);
      --convai-button-border-color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="wordmark">Claule</div>
    <div class="widget-area">
      <elevenlabs-convai agent-id="agent_4001kyds411mf0ht9ahcn81rc5bt"></elevenlabs-convai>
    </div>
    <div class="tagline">speak &middot; think &middot; explore</div>
  </div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>

  <script>
    // Load memories before conversation starts
    (async function () {
      try {
        const r = await fetch('https://theadventure.app.n8n.cloud/webhook/claule-memory-load');
        const d = await r.json();
        if (d.memories) {
          document.querySelector('elevenlabs-convai')
            .setAttribute('dynamic-variables', JSON.stringify({ past_memories: d.memories }));
        }
      } catch (e) {
        // Memory load failed — Claule starts fresh, no blocking
      }
    })();

    // Auto-save memories when conversation ends
    window.addEventListener('elevenlabs-convai:disconnect', function (e) {
      const conversationId = e.detail?.conversation_id || e.detail?.conversationId;
      if (!conversationId) return;
      fetch('https://theadventure.app.n8n.cloud/webhook/claule-post-call', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: conversationId })
      }).catch(() => {});
    });

    // Also listen on the widget element itself
    document.addEventListener('DOMContentLoaded', function () {
      const widget = document.querySelector('elevenlabs-convai');
      if (!widget) return;
      ['disconnect', 'conversation-end', 'session-end'].forEach(function (evt) {
        widget.addEventListener(evt, function (e) {
          const conversationId = e.detail?.conversation_id || e.detail?.conversationId || e.detail?.id;
          if (!conversationId) return;
          fetch('https://theadventure.app.n8n.cloud/webhook/claule-post-call', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversation_id: conversationId })
          }).catch(() => {});
        });
      });
    });
  </script>
</body>
</html>
