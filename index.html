<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claele</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      padding: 2rem 1rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 420px;
    }

    .wordmark {
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 2.5rem;
      user-select: none;
    }

    .widget-area {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tagline {
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      user-select: none;
    }

    elevenlabs-convai {
      --convai-background-color: transparent;
      --convai-button-color: rgba(255,255,255,0.08);
      --convai-button-border-color: rgba(255,255,255,0.15);
    }

    /* Pending / loading screens */
    .status-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
      padding: 0 2rem;
    }
    .status-screen.visible { display: flex; }
    .status-screen p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
      max-width: 280px;
    }
    .status-screen .label {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .signout {
      margin-top: 1rem;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: none;
      border: none;
      transition: color 0.2s;
    }
    .signout:hover { color: rgba(255,255,255,0.55); }

    /* Context section */
    .context-section {
      display: none;
      width: 100%;
      margin-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 1.25rem;
    }
    .context-section.visible { display: block; }

    .context-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .context-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    .context-edit-btn {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.2s;
    }
    .context-edit-btn:hover { color: rgba(255,255,255,0.6); }

    .context-text {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.65;
    }
    .context-text.empty {
      color: rgba(255,255,255,0.2);
      font-style: italic;
    }

    /* Edit form */
    .context-form {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .context-form.visible { display: flex; }

    .upload-zone {
      width: 100%;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
      position: relative;
      transition: border-color 0.2s, color 0.2s;
    }
    .upload-zone:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.55); }
    .upload-zone.has-file { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.65); }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .or-divider {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      text-align: center;
    }

    textarea.ctx-textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 0.82rem;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea.ctx-textarea:focus { border-color: rgba(255,255,255,0.3); }
    textarea.ctx-textarea::placeholder { color: rgba(255,255,255,0.2); }

    .form-actions {
      display: flex;
      gap: 0.75rem;
    }
    .btn-save {
      flex: 1;
      padding: 0.65rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
    .btn-save:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-cancel {
      padding: 0.65rem 1rem;
      background: none;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: rgba(255,255,255,0.35);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.2s;
    }
    .btn-cancel:hover { color: rgba(255,255,255,0.6); }

    .ctx-status {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      min-height: 1rem;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="wordmark">Claele</div>

    <!-- Loading state -->
    <div class="status-screen" id="screen-loading">
      <div class="label">Loading...</div>
    </div>

    <!-- Pending approval state -->
    <div class="status-screen" id="screen-pending">
      <div class="label">Pending approval</div>
      <p>Your account is being reviewed. You'll have access shortly.</p>
      <button class="signout" onclick="signOut()">Sign out</button>
    </div>

    <!-- Main widget (shown when approved) -->
    <div class="widget-area" id="widget-area" style="display:none">
      <elevenlabs-convai agent-id="agent_4001kyds411mf0ht9ahcn81rc5bt"></elevenlabs-convai>
    </div>

    <div class="tagline">speak &middot; think &middot; explore</div>

    <!-- Context section -->
    <div class="context-section" id="context-section">
      <div class="context-header">
        <span class="context-label">Claele knows you as</span>
        <button class="context-edit-btn" id="ctx-edit-btn" onclick="toggleContextForm()">Edit</button>
      </div>
      <div class="context-text" id="ctx-display"></div>

      <div class="context-form" id="ctx-form">
        <div class="upload-zone" id="ctx-upload-zone">
          <input type="file" id="ctx-file" accept=".zip,.json" />
          <span id="ctx-upload-label">Upload Gemini ZIP — Claele will build your profile from it</span>
        </div>
        <div class="or-divider">or write it yourself</div>
        <textarea class="ctx-textarea" id="ctx-textarea" placeholder="Describe yourself — your work, interests, projects, goals. Claele will use this in every conversation."></textarea>
        <div class="form-actions">
          <button class="btn-save" id="ctx-save-btn" onclick="saveContext()">Save</button>
          <button class="btn-cancel" onclick="toggleContextForm()">Cancel</button>
        </div>
        <div class="ctx-status" id="ctx-status"></div>
      </div>
    </div>
  </div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    const SB_URL = 'https://rzkykbwszqcpxrggmivr.supabase.co';
    const SB_KEY = 'sb_publishable_5gzlAh1HwhMVCn41k6-Jxg_PsnsRlHB';
    const N8N_UPDATE_CONTEXT = 'https://theadventure.app.n8n.cloud/webhook/claele-update-context';

    let _userId = null;
    let _currentContext = '';

    function showScreen(id) {
      ['screen-loading', 'screen-pending'].forEach(s => {
        document.getElementById(s).classList.remove('visible');
      });
      document.getElementById('widget-area').style.display = 'none';
      if (id === 'widget') {
        document.getElementById('widget-area').style.display = 'flex';
      } else {
        document.getElementById(id).classList.add('visible');
      }
    }

    function signOut() {
      localStorage.removeItem('claele_session');
      window.location.href = 'login.html';
    }

    function renderContextSection(userContext) {
      const section = document.getElementById('context-section');
      const display = document.getElementById('ctx-display');
      _currentContext = userContext || '';

      if (_currentContext) {
        display.textContent = _currentContext.length > 220
          ? _currentContext.slice(0, 220) + '…'
          : _currentContext;
        display.classList.remove('empty');
        document.getElementById('ctx-edit-btn').textContent = 'Edit';
      } else {
        display.textContent = 'No context set — Claele is building a picture of you through conversation.';
        display.classList.add('empty');
        document.getElementById('ctx-edit-btn').textContent = 'Add context';
      }

      document.getElementById('ctx-textarea').value = _currentContext;
      section.classList.add('visible');
    }

    function toggleContextForm() {
      const form = document.getElementById('ctx-form');
      form.classList.toggle('visible');
      document.getElementById('ctx-status').textContent = '';
    }

    document.getElementById('ctx-file').addEventListener('change', function() {
      const f = this.files[0];
      document.getElementById('ctx-upload-label').textContent = f ? f.name : 'Upload Gemini ZIP — Claele will build your profile from it';
      document.getElementById('ctx-upload-zone').classList.toggle('has-file', !!f);
    });

    async function extractGeminiContent(file) {
      if (!file.name.endsWith('.zip')) return file.text();
      const zip = await JSZip.loadAsync(file);
      const files = Object.values(zip.files).filter(f => !f.dir);
      const scored = files.map(f => {
        const n = f.name.toLowerCase();
        let s = 0;
        if (n.endsWith('.json')) s += 10;
        if (n.includes('gemini')) s += 5;
        if (n.includes('activity')) s += 3;
        if (n.endsWith('.html')) s += 1;
        return { f, s };
      }).sort((a, b) => b.s - a.s);
      if (!scored.length) throw new Error('No data found in ZIP');
      return scored[0].f.async('text');
    }

    async function saveContext() {
      const btn = document.getElementById('ctx-save-btn');
      const status = document.getElementById('ctx-status');
      const file = document.getElementById('ctx-file').files[0];
      const text = document.getElementById('ctx-textarea').value.trim();

      if (!file && !text) {
        status.textContent = 'Upload a ZIP or write something about yourself.';
        return;
      }

      btn.disabled = true;
      status.textContent = file ? 'Extracting from ZIP…' : 'Saving…';

      try {
        const body = { user_id: _userId };

        if (file) {
          status.textContent = 'Reading ZIP…';
          body.gemini_content = await extractGeminiContent(file);
          status.textContent = 'Building your profile with Claude…';
        } else {
          body.user_context = text;
        }

        const res = await fetch(N8N_UPDATE_CONTEXT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('Save failed');

        status.textContent = file
          ? 'Done — Claele will know you better next conversation.'
          : 'Saved.';

        // Refresh display
        _currentContext = text || '(generated from ZIP — refresh to see)';
        renderContextSection(_currentContext);
        document.getElementById('ctx-form').classList.remove('visible');
        document.getElementById('ctx-file').value = '';
        document.getElementById('ctx-upload-label').textContent = 'Upload Gemini ZIP — Claele will build your profile from it';
        document.getElementById('ctx-upload-zone').classList.remove('has-file');

      } catch(e) {
        status.textContent = 'Something went wrong. Try again.';
      } finally {
        btn.disabled = false;
      }
    }

    async function sbGet(path, token) {
      const res = await fetch(SB_URL + path, {
        headers: {
          'apikey': SB_KEY,
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      return res.json();
    }

    async function init() {
      showScreen('screen-loading');

      const raw = localStorage.getItem('claele_session');
      if (!raw) { window.location.href = 'login.html'; return; }

      let session;
      try { session = JSON.parse(raw); } catch(e) { window.location.href = 'login.html'; return; }
      const { access_token, user_id } = session;
      if (!access_token || !user_id) { window.location.href = 'login.html'; return; }

      _userId = user_id;

      let profile = null;
      try {
        const profiles = await sbGet(`/rest/v1/profiles?id=eq.${user_id}&select=name,user_context,approved`, access_token);
        profile = Array.isArray(profiles) ? profiles[0] : null;
      } catch(e) {}

      if (!profile) { showScreen('screen-pending'); return; }
      if (!profile.approved) { showScreen('screen-pending'); return; }

      let pastMemories = '';
      try {
        const r = await fetch(`https://theadventure.app.n8n.cloud/webhook/claele-memory-load?user_id=${encodeURIComponent(user_id)}`);
        const d = await r.json();
        if (d.memories) pastMemories = d.memories;
      } catch(e) {}

      const widget = document.querySelector('elevenlabs-convai');
      widget.setAttribute('dynamic-variables', JSON.stringify({
        past_memories: pastMemories,
        user_name: profile.name || 'there',
        user_context: profile.user_context || '',
        user_id: user_id
      }));
      showScreen('widget');
      renderContextSection(profile.user_context);

      let postCallSent = false;
      function triggerPostCall(conversationId) {
        if (!conversationId || postCallSent) return;
        postCallSent = true;
        fetch('https://theadventure.app.n8n.cloud/webhook/claele-post-call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation_id: conversationId, user_id: user_id })
        }).catch(() => {});
      }

      function getConvId(e) {
        return e.detail?.conversation_id || e.detail?.conversationId || e.detail?.id;
      }

      ['disconnect', 'conversation-end', 'session-end', 'elevenlabs-convai:disconnect'].forEach(function(evt) {
        widget.addEventListener(evt, function(e) { triggerPostCall(getConvId(e)); });
      });
      ['elevenlabs-convai:disconnect', 'elevenlabs-convai:call-end'].forEach(function(evt) {
        window.addEventListener(evt, function(e) { triggerPostCall(getConvId(e)); });
      });
    }

    init();
  </script>
</body>
</html>
