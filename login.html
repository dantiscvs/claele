<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claele — Sign In</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    .wordmark {
      font-size: 1.15rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: rgba(255,255,255,0.35); }
    input::placeholder { color: rgba(255,255,255,0.3); }
    button {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      color: #fff;
      font-size: 0.88rem;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }
    button:hover { background: rgba(255,255,255,0.14); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg {
      font-size: 0.8rem;
      text-align: center;
      min-height: 1.1rem;
    }
    .msg.error { color: rgba(255, 100, 100, 0.9); }
    .footer-link {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      letter-spacing: 0.04em;
    }
    .footer-link a { color: rgba(255,255,255,0.55); text-decoration: none; }
    .footer-link a:hover { color: rgba(255,255,255,0.85); }
    .tagline {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="wordmark">Claele</div>

    <form id="form">
      <input type="email" id="email" placeholder="Email" required autocomplete="email" />
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="btn">Sign In</button>
      <div class="msg error" id="msg"></div>
    </form>

    <div class="footer-link">No account? <a href="register.html">Create one</a></div>
    <div class="tagline">speak &middot; think &middot; explore</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SB_URL = 'https://rzkykbwszqcpxrggmivr.supabase.co';
    const SB_KEY = 'sb_publishable_5gzlAh1HwhMVCn41k6-Jxg_PsnsRlHB';
    const sb = window.supabase.createClient(SB_URL, SB_KEY);

    // Redirect if already signed in
    const existing = localStorage.getItem('claele_session');
    if (existing) { try { if (JSON.parse(existing).access_token) window.location.href = 'index.html'; } catch(e) {} }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      msg.textContent = '';

      try {
        const { data, error } = await sb.auth.signInWithPassword({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        if (error) throw new Error('Email or password doesn\'t exist');

        localStorage.setItem('claele_session', JSON.stringify({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token,
          user_id: data.user.id
        }));
        window.location.href = 'index.html';
      } catch (ex) {
        msg.textContent = ex.message;
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
